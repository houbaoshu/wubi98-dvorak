<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GNOME 下 ibus 的候选框由 gnome-shell 画，字体是 Shell 主题的（Cantarell），
  拆分字根和超集生僻字都靠 fontconfig 回退。默认的回退顺序里 98WB 排在很后面：
  BMP 私用区的字根（只有 98WB-V 有）会被 OpenSymbol 等字体抢先，画成不相干的符号。

  这里只对 gnome-shell 进程（prgname）在 sans-serif 之前插入：
    Noto Sans CJK SC  常用汉字仍用它（装了 fonts-noto-cjk 时）
    98WB-0            拆分字根（plane 15 私用区），同 Mac 上 wubi98_ci 的注释字体
    98WB-V            BMP 私用区字根
    98WB-U            超集里的扩展 B 及以后的生僻字
  拉丁字母仍由 Cantarell 画；其他程序不受影响。
  由 linux/deploy.sh 装到 ~/.config/fontconfig/conf.d/。改了要注销重新登录才生效。
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>gnome-shell</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
      <string>98WB-0</string>
      <string>98WB-V</string>
      <string>98WB-U</string>
    </edit>
  </match>
</fontconfig>
