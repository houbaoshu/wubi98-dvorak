patch:
  "style/font_face": "98WB-V,98WB-U"
  "style/text_orientation": horizontal
  "style/inline_preedit": false
  "style/horizontal": false
  "style/candidate_list_layout": stacked
  "style/font_point": 18
  "style/comment_font_face": "98WB-3"
  "style/comment_font_point": 16
  # 拼音反查用 py，三重注解用 wb_spelling；列为依赖后部署时会一并编译，
  # 不必出现在方案选单里。
  "schema/dependencies": [py, wb_spelling]
  # 德沃夏克 -> QWERTY 按物理位置重映射，挂在 ascii_composer 之后
  "engine/processors/@after 0": "lua_processor@*dvorak_remap"
  # 单字、繁简开关保留上次的选择：整项替换以去掉原方案里的 reset: 0，
  # 配合 default.custom.yaml 里 switcher/save_options 的这两项。
  "switches/@1":
    name: zh_trad
    states: [ 简,繁 ]
  "switches/@6":
    name: single_char
    states: [ 词,单 ]
  # 去掉小键盘小数点绑定（KP_Decimal 换成 period 重发，会被 dvorak_remap 再转换一次）。
  # patch 不能删除列表项，只能整表替换：下面是原方案 key_binder/bindings 去掉
  # 那一条后的全部内容，原方案的绑定改了要同步。
  "key_binder/bindings":
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: semicolon, send: 2, when: has_menu}
    - {accept: apostrophe, send: 3, when: has_menu}
    - {accept: space, send: Escape, when: composing}
    - {accept: space, send: space, when: has_menu}
    - {accept: Return, send: Escape, when: composing}
    - {accept: Return, send: Escape, when: has_menu}
    - {accept: "Control+Shift+4", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+dollar", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+F", toggle: zh_trad, when: always}
    - {accept: "Control+Shift+H", toggle: new_spelling, when: always}
    - {accept: "Control+Shift+J", toggle: new_hide_pinyin, when: always}
    - {accept: "Control+Shift+K", toggle: single_char, when: always}
    - {accept: "Control+Shift+U", toggle: GB2312, when: always}
    - {accept: KP_0, send: 0, when: composing}
    - {accept: KP_1, send: 1, when: composing}
    - {accept: KP_2, send: 2, when: composing}
    - {accept: KP_3, send: 3, when: composing}
    - {accept: KP_4, send: 4, when: composing}
    - {accept: KP_5, send: 5, when: composing}
    - {accept: KP_6, send: 6, when: composing}
    - {accept: KP_7, send: 7, when: composing}
    - {accept: KP_8, send: 8, when: composing}
    - {accept: KP_9, send: 9, when: composing}
